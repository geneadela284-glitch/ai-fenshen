name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The snapshot must stay installable: --frozen-lockfile fails on
      # lockfile drift, which is exactly the class of break this guards.
      # The repo's own test suites are intentionally NOT run here: they
      # depend on internal state documents and branches that are excluded
      # from this public, scrubbed snapshot by design.
      - name: Verify snapshot installs cleanly
        run: pnpm install --frozen-lockfile
