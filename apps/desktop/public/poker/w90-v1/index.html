<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0000ff"><link rel="icon" href="data:,"><title>怀旧扑克机</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0000ff;color:#ffff00;font:18px system-ui,-apple-system,sans-serif;touch-action:manipulation;-webkit-text-size-adjust:100%}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:2px}
#game{--safe-t:env(safe-area-inset-top,0px);--safe-r:env(safe-area-inset-right,0px);--safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);--left-rail:70px;--right-rail:144px;--gap:7px;--button-h:clamp(48px,calc((100dvh - var(--safe-t) - var(--safe-b) - 35px)/4),76px);position:relative;width:100%;height:100%;background:#0000ff;isolation:isolate}
#table-area{position:absolute;inset:max(8px,var(--safe-t)) calc(var(--right-rail) + max(10px,var(--safe-r)) + 8px) max(8px,var(--safe-b)) calc(var(--left-rail) + max(10px,var(--safe-l)) + 8px);display:flex;align-items:center;justify-content:center;container-type:size}
#stage{position:relative;flex:none;width:min(100cqw,calc(100cqh * 1.51634));aspect-ratio:1.51634;background:var(--arcade-blue,#0000ff)}#hd-screen{width:100%;height:100%;display:block;outline:none;touch-action:manipulation}#gold-holds{position:absolute;inset:0;pointer-events:none}
.controls{position:absolute;z-index:2;display:grid;gap:var(--gap);bottom:max(10px,var(--safe-b))}.controls-left{left:max(10px,var(--safe-l));width:var(--left-rail)}.controls-right{right:max(10px,var(--safe-r));width:var(--right-rail)}
.arcade-key{height:var(--button-h);min-height:48px;width:100%;border:1px solid #ffff0080;border-radius:9px;color:#ffff00;background:rgba(0,0,70,.30);text-shadow:0 1px 2px #000050;font-size:24px;font-weight:650;padding:0 4px;box-shadow:inset 0 -3px 0 #00003630}.arcade-key:active{background:#ffff003c;border-color:#fffbc0;box-shadow:inset 0 0 12px #ffff0040}.arcade-key:disabled{opacity:.42}.main-action{border:2px solid #ffff00b0;background:#ffff001a}.coin-key{color:#23ff48;border-color:#23ff4875}.back-key{font-size:17px;color:#ffff00bb;border-color:#ffff0045}.high-low{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.gold-hold{position:absolute;border:2px solid #ffe5a0;border-radius:5px;box-shadow:0 0 9px #ffc738bb,inset 0 0 7px #ffc73877;animation:gold-light 1.8s ease-in-out infinite}.gold-hold:before{content:"";position:absolute;inset:-3px;border-radius:6px;padding:3px;background:conic-gradient(from var(--angle),#b77716,#ffeeb0,#bf8822,#fff2a4,#a96310);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:gold-turn 2.6s linear infinite}@property --angle{syntax:"<angle>";initial-value:0deg;inherits:false}@keyframes gold-turn{to{--angle:360deg}}@keyframes gold-light{50%{box-shadow:0 0 15px #ffd353dd,inset 0 0 9px #ffc73888}}
#canvas{position:fixed;left:-2000px;top:0;width:256px!important;height:232px!important;pointer-events:none;outline:none}#start-panel{position:absolute;inset:0;z-index:5;display:grid;place-content:center;text-align:center;gap:14px;padding:28px;background:#00009b}#start-panel h1{font-size:27px;margin:0;letter-spacing:3px}#start{justify-self:center;min-width:220px;min-height:68px;border:2px solid #ffff00b0;border-radius:9px;background:#00005480;color:#ffff00;font-size:24px}#start:disabled{opacity:.5}#launch-detail{font-size:14px;line-height:1.7;max-width:340px;margin:0;color:#ffffffbd}#start-retry{min-height:48px;border:1px solid #ffff0080;border-radius:6px;background:#00005480;color:#ffff00;padding:8px 24px}
#status{position:absolute;z-index:7;top:max(12px,var(--safe-t));left:50%;transform:translateX(-50%);max-width:calc(100% - 40px);font-size:14px;line-height:1.5;text-align:center;background:#000056ed;color:#fff;padding:10px 16px;border-radius:7px}#status:not(.visible){display:none}#status[data-kind=error]{border:1px solid #ffb0a0;color:#ffe4df}#back-cover{position:absolute;top:max(12px,var(--safe-t));left:max(12px,var(--safe-l));z-index:6;width:64px;height:48px;color:#ffff00;border:1px solid #ffff0070;border-radius:7px;background:#00005460;font-size:17px}#log{display:none}#status[data-kind=audio]{border:1px solid #ffb0a0;color:#ffe4df}#resume-audio{position:absolute;z-index:8;top:calc(max(12px,var(--safe-t)) + 78px);left:50%;transform:translateX(-50%);width:160px;height:48px;background:#000054ed;font-size:20px}#resume-audio[hidden]{display:none}
@media(orientation:portrait){#game{--left-rail:clamp(76px,20vw,94px);--right-rail:calc(100% - var(--left-rail) - 36px);--button-h:clamp(54px,7.2dvh,68px);--dock:calc(var(--button-h)*3 + var(--gap)*2)}#table-area{inset:max(10px,var(--safe-t)) 8px calc(var(--dock) + max(12px,var(--safe-b)) + 12px);align-items:center}#stage{width:min(100cqw,calc(100cqh * .67540));aspect-ratio:.67540}.controls{bottom:max(12px,var(--safe-b))}.controls-left{left:12px}.controls-right{right:12px;grid-template-columns:1fr 1fr}.controls-right [data-key=" "]{grid-column:2;grid-row:3}.high-low{grid-column:1/3;grid-row:2}.controls-right [data-key=Enter]{grid-column:1/3;grid-row:1}.controls-right [data-key=s]{grid-column:1;grid-row:3}.arcade-key{font-size:24px}.main-action{font-size:25px}}
@media(orientation:landscape){.controls-right [data-key=" "]{order:0}.high-low{order:1}.controls-right [data-key=Enter]{order:2}.controls-right [data-key=s]{order:3}}
@media(orientation:landscape) and (max-height:300px){#game{--right-rail:124px;--left-rail:64px;--gap:5px}.arcade-key{font-size:21px}#start-panel{gap:8px}#start{min-height:56px}#start-panel h1{font-size:23px}}

</style></head><body>
<main id="game" aria-label="怀旧扑克机">
<div id="table-area"><div id="stage"><canvas id="hd-screen" width="1024" height="816" tabindex="0" aria-label="点牌框选，再点取消"></canvas><div id="gold-holds" aria-hidden="true"></div></div></div>
<canvas id="canvas" width="256" height="232" tabindex="-1" aria-hidden="true"></canvas>
<nav class="controls controls-left" aria-label="辅助操作"><button data-key="c" class="arcade-key coin-key" disabled>上分</button><button data-key="b" class="arcade-key" disabled>押注</button><button id="back" class="arcade-key back-key">返回</button></nav>
<nav class="controls controls-right" aria-label="主要操作"><button data-key="Enter" class="arcade-key main-action" aria-label="翻牌或换牌" disabled>翻牌</button><button data-key="s" class="arcade-key" disabled>得分</button><button data-key=" " class="arcade-key" disabled>比倍</button><div class="high-low"><button data-key="ArrowLeft" class="arcade-key" disabled>大</button><button data-key="ArrowRight" class="arcade-key" disabled>小</button></div></nav>
<div id="start-panel"><h1>怀旧扑克机</h1><button id="start" disabled>读取本机牌局…</button><p id="launch-detail" role="status" aria-live="polite">正在准备原机…</p><button id="start-retry" hidden>重新加载</button></div><button id="back-cover" aria-label="返回游戏目录">返回</button><div id="status" role="status" aria-live="polite"></div><button id="resume-audio" class="arcade-key" hidden>恢复声音</button><pre id="log"></pre>
</main>
<script>(function(){var b=document.getElementById('start'),d=document.getElementById('launch-detail'),r=document.getElementById('start-retry');var p=window.PokerStartup={phase:'waiting',events:[]};p.stage=function(phase,message){p.phase=phase;p.events.push({phase:phase,message:message});if(d.isConnected)d.textContent=message;};p.fail=function(message){p.stage('failed',message);b.disabled=true;b.textContent='暂时无法开始';r.hidden=!!window.proof?.started;};p.markReady=function(saved){p.stage('ready',saved?'上次牌局已保存在本机。':'准备好了。');b.textContent=saved?'继续牌局':'开始游戏';b.disabled=false;};r.onclick=function(){if(!window.proof?.started)location.reload();};}());</script>
<script type="module" src="./runtime.js" onerror="window.PokerStartup.fail('原机组件读取失败，已有存档保留。')"></script>
</body></html>
